name: Validate Plugins

# 只做校验，不产出任何文件。
# 索引由 build-index.yml 在合并后自动重建 —— 贡献者不需要（也不允许）手改 index.json。

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要完整历史：版本 bump 检查要与基准分支 diff（origin/<base>），
          # shallow clone 拿不到；"禁止手改 index.json" 的判定也要 diff base。
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch EasyAI core (SDK contracts)
        # 主仓是**私有仓库**时，匿名 clone 一定失败，必须提供
        # secrets.EASYAI_CORE_TOKEN（细粒度 PAT，仅需对主仓的 Contents: Read）。
        #
        # 拿不到 SDK 时脚本会降级为 schema-only 校验并打印 WARN ——
        # **刻意不静默降级**，也不伪造"严格模式通过"。
        env:
          CORE_REPO: ${{ vars.EASYAI_CORE_REPO || 'Await-d/EasyAI' }}
          CORE_TOKEN: ${{ secrets.EASYAI_CORE_TOKEN }}
        run: |
          if [ -n "$CORE_TOKEN" ]; then
            git clone --depth 1 "https://x-access-token:${CORE_TOKEN}@github.com/${CORE_REPO}" core
          else
            echo "::warning::未配置 EASYAI_CORE_TOKEN；若主仓为私有仓库，本次将降级为 schema-only 校验"
            git clone --depth 1 "https://github.com/${CORE_REPO}" core || true
          fi

      - name: Install validation deps
        # 降级模式（拿不到 SDK）下用于校验本仓 schema 副本
        run: pip install "jsonschema>=4.0"

      - name: Validate manifests and contracts
        env:
          PYTHONPATH: ${{ github.workspace }}/core/backend
        run: |
          # --base-ref  改了 plugin.json / *.py 却没 bump version → 失败。
          #             PR 用 origin/<base>；push 到 main 时 base_ref 为空，回退 main
          #             （此时 diff 为空，等价于不检查）。
          # --core-schema  本仓 schema/ 是主仓副本，必须逐字一致 —— 副本漂移会让
          #             PR 全绿但用户在真机上装不上。拿不到主仓时脚本会 WARN 跳过。
          python scripts/validate.py \
            --base-ref "origin/${{ github.base_ref || 'main' }}" \
            --core-schema "core/backend/sdk/schema/plugin-manifest.schema.json"

      - name: Reject committed build artifacts
        # 本地跑过一次插件就会生成 __pycache__，validate.py 刻意不报它（会造成假失败）。
        # 但**提交**上来必须挡住 —— 用 git 索引判定，而不是磁盘。
        run: |
          if git ls-files | grep -E '(__pycache__/|\.pyc$|\.pyo$|(^|/)\.venv/)'; then
            echo "::error::禁止提交 __pycache__ / *.pyc / .venv"
            exit 1
          fi
          echo "无构建产物被提交 ✅"

      - name: Reject manual edits to generated index.json
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qx 'index.json'; then
            echo "::error file=index.json::index.json 是生成物，请勿手工修改；合并后 CI 会自动重建。"
            exit 1
          fi
          echo "index.json 未被手工修改 ✅"
